
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhúng CSS vào HTML</title>

    <!-- Phần 2: Internal CSS -->
    <style>
        h1 {
            color: blue;
        }
    </style>

    <!-- Phần 3: External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Phần 1: Inline CSS -->
    <h1 style="color: red;">Phần 1: Inline CSS</h1>
    <p style="color: red;">Đây là đoạn văn sử dụng inline-style.</p>

    <h1>Phần 2: Internal CSS</h1>
    <p>Đây là đoạn văn sử dụng internal-style.</p>

    <h1 class="external-title">Phần 3: External CSS</h1>
    <p class="external-text">Đây là đoạn văn sử dụng external-style.</p>
</body>
</html>
